name: Projekt C – natuerliche 16-Monats-Kreditkrise
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_real_credit_longrun_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/test_real_insolvency_longrun_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/test_real_contract_settlement_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/test_real_parallel_contracts_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/test_real_three_contracts_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/REAL_THREE_CONTRACTS_20261031.md'
      - 'project-c/pppoppi-imperium/quality_v194/REAL_PARALLEL_CONTRACTS_20261031.md'
      - 'project-c/pppoppi-imperium/quality_v194/REAL_CREDIT_LONGRUN_20261031.md'
      - 'project-c/pppoppi-imperium/prerelease/matrix.json'
      - '.github/workflows/prerelease-real-credit-longrun.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-credit-longrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Echte Kreditkrise und wiederholte Rettung
        shell: bash
        run: |
          set -euo pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_real_credit_longrun_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_real_credit_longrun_v194.cjs | tee real_credit_longrun.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('real_credit_longrun.json','utf8'));
          assert.equal(r.schema,'pppoppi.real-credit-longrun/1');
          assert.equal(r.scenarios,2);
          assert.equal(r.months,16);
          assert.equal(r.companyMonthsChecked,64);
          assert.equal(r.realActions,10);
          assert.equal(r.firstArrearsCent,40000);
          assert.equal(r.secondRescueMonth,14);
          assert.equal(r.secondArrearsCent,195957);
          assert.equal(r.creditPerRescueCent,4000000);
          assert.equal(r.finalCashCent,2815799);
          assert.equal(r.finalDebtCent,5463166);
          assert.equal(r.jsonRoundtrips,5);
          assert.equal(r.negativeCases,48);
          assert.equal(r.historicalReportsChecked,16);
          assert.equal(r.noInjectedCashOrDebt,true);
          assert.equal(r.prereleaseGate,'BLOCKED');
          NODE
      - name: Natuerliche Insolvenz mit Feldfreigabe und Neustart
        shell: bash
        run: |
          set -euo pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_real_insolvency_longrun_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_real_insolvency_longrun_v194.cjs | tee real_insolvency_longrun.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('real_insolvency_longrun.json','utf8'));
          assert.equal(r.schema,'pppoppi.real-insolvency-longrun/1');
          assert.equal(r.scenarios,2);
          assert.equal(r.months,14);
          assert.equal(r.companyMonthsChecked,56);
          assert.equal(r.realActions,10);
          assert.equal(r.firstRescueMonth,1);
          assert.equal(r.naturalInsolvencyMonth,14);
          assert.equal(r.arrearsCent,195957);
          assert.deepEqual(r.releasedClaims,['BERLIN-1','BRANDENBURG-1']);
          assert.equal(r.roundtrips,3);
          assert.equal(r.negativeCases,50);
          assert.equal(r.crisisNegativeCases,14);
          assert.equal(r.noInjectedCashOrDebt,true);
          assert.equal(r.unrelatedCompanyPreserved,true);
          assert.equal(r.prereleaseGate,'BLOCKED');
          NODE
      - name: Reale Vertragserfuellung und Vertragsstrafe unabhaengig pruefen
        shell: bash
        run: |
          set -euo pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_real_contract_settlement_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_real_contract_settlement_v194.cjs | tee real_contract_settlement.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('real_contract_settlement.json','utf8'));
          assert.equal(r.schema,'pppoppi.real-contract-settlement/1');
          assert.equal(r.scenarios,4);
          assert.equal(r.companyMonthsChecked,16);
          assert.equal(r.duplicateChecks,38);
          assert.equal(r.jsonRoundtrips,8);
          assert.equal(r.negativeCases,40);
          assert.equal(r.delivery.deliveredMilli,40000);
          assert.equal(r.delivery.revenueCent,2987600);
          assert.equal(r.delivery.contractInvoiceCent,20000);
          assert.equal(r.breach.deliveredMilli,0);
          assert.equal(r.breach.contractInvoiceCent,746900);
          assert.equal(r.prereleaseGate,'BLOCKED');
          NODE
      - name: Zwei parallele Regionalvertraege mit natuerlicher Teillieferung
        shell: bash
        run: |
          set -euo pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_real_parallel_contracts_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_real_parallel_contracts_v194.cjs | tee real_parallel_contracts.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('real_parallel_contracts.json','utf8'));
          assert.equal(r.schema,'pppoppi.real-parallel-contracts/1');
          assert.equal(r.scenarios,2);
          assert.equal(r.companyMonthsChecked,8);
          assert.equal(r.partialDeliveredMilli,20000);
          assert.equal(r.completeDeliveredMilli,40000);
          assert.deepEqual(r.contractRegions,['NORD','BERLIN']);
          assert.equal(r.negativeCases,24);
          assert.equal(r.jsonRoundtrips,6);
          assert.equal(r.noInjectedCashOrInventory,true);
          assert.equal(r.prereleaseGate,'BLOCKED');
          NODE
      - name: Drei parallele Regionalvertraege einer Firma mit Voll-, Teil- und Nulllieferung
        shell: bash
        run: |
          set -euo pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_real_three_contracts_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_real_three_contracts_v194.cjs | tee real_three_contracts.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('real_three_contracts.json','utf8'));
          assert.equal(r.schema,'pppoppi.real-three-contracts/1');
          assert.equal(r.scenarios,2);
          assert.equal(r.companyMonthsChecked,24);
          assert.equal(r.negativeCases,40);
          assert.equal(r.jsonRoundtrips,10);
          assert.deepEqual(r.contractRegions,['BERLIN','NORD','BRANDENBURG']);
          assert.equal(r.deliveredMilli[0],40000);
          assert.ok(r.deliveredMilli[1]>0&&r.deliveredMilli[1]<40000);
          assert.equal(r.deliveredMilli[2],0);
          assert.equal(r.partialDeliveredMilli,r.deliveredMilli[1]);
          assert.equal(r.secondCycleDeliveredMilli,40000);
          assert.ok(Number.isSafeInteger(r.secondCycleRevenueCent)&&
            r.secondCycleRevenueCent>0);
          assert.equal(r.noInjectedCashOrInventory,true);
          assert.equal(r.prereleaseGate,'BLOCKED');
          NODE
      - name: Reproduzierbare JSON-Ausgabe sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-credit-longrun
          path: |
            real_credit_longrun.json
            real_insolvency_longrun.json
            real_contract_settlement.json
            real_parallel_contracts.json
            real_three_contracts.json
          if-no-files-found: warn
          retention-days: 14
