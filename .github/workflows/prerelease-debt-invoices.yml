name: Projekt C – 12 Monate Zins und Tilgung
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_debt_invoice_12months_v194.cjs'
      - '.github/workflows/prerelease-debt-invoices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debt-invoices:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zins, Tilgung und mehrere Rechnungen ueber 12 Monate pruefen
        run: node project-c/pppoppi-imperium/quality_v194/test_debt_invoice_12months_v194.cjs
