name: Projekt C – Marktpreise und begrenzte Nachfrage
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_market_demand_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/MARKET_DEMAND_20261031.md'
      - 'project-c/pppoppi-imperium/SPIEL/src/**'
      - 'project-c/pppoppi-imperium/prerelease/matrix.json'
      - '.github/workflows/prerelease-market-demand.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-demand:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Echte Preisentwicklung und isolierte Nachfragegrenze pruefen
        run: |
          set -o pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_market_demand_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_market_demand_v194.cjs | tee market_demand.json
          node -e "const r=require('./market_demand.json'),a=r.result; if(r.schema!=='pppoppi.multifirm-market-audit/1'||r.runs!==2||r.simulatedMonths!==22||r.companyMonthChecks!==44||r.jsonRoundtrips!==42||r.duplicatesRejected!==16||r.corruptionsCaught!==30||r.foreignActionsRejected!==2||r.publicRepairs!==2||r.allocatorCapChecked!==true||r.noInjectedInventoryOrCash!==true||r.prereleaseGate!=='BLOCKED'||!a||a.months!==11||a.sold?.H1!==27000||a.sold?.H2!==27000||a.distinctPriceCount<3||a.distinctDemandCount<3||JSON.stringify(a.bottleneckMonths)!=='[3,6]')process.exit(1);"
      - name: Reproduzierbaren JSON-Nachweis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-demand-11months
          path: market_demand.json
          if-no-files-found: warn
          retention-days: 14
