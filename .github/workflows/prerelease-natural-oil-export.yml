name: Projekt C – echte Oelfoerderung bis Aussenmarkt (gezielter Test)
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_natural_oil_to_export_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/NATURAL_OIL_EXPORT_20261030.md'
      - 'project-c/pppoppi-imperium/prerelease/matrix.json'
      - '.github/workflows/prerelease-natural-oil-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-oil-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und echte Produktions-, Raffinerie- und Frachtkette
        run: |
          set -o pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_natural_oil_to_export_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_natural_oil_to_export_v194.cjs | tee natural_oil_export.json
          node -e "const r=require('./natural_oil_export.json'); const a=r.rows; if(r.scenarios!==2 || r.repeatedRuns!==2 || r.totalSimulatedMonths!==20 || r.checkedCompanyMonths!==40 || a.length!==2 || a[0].soldMilli!==9000 || a[0].revenueCent<=0 || a[1].soldMilli!==0 || a[1].refundedMilli!==9000 || !a.every(x=>x.ledgerReconciled && x.duplicateQueueRejected && x.jsonRoundtrips===5 && x.cashBridge && x.cashBridge.netCent===Object.entries(x.cashBridge).filter(([k])=>k.endsWith('Cent') && k!=='netCent').reduce((n,[,v])=>n+v,0) && x.cashBridge.investmentCent<0 && x.cashBridge.actionCostCent<0 && x.cashBridge.freightHoldCent<0 && x.cashBridge.salesCent>=x.revenueCent) || r.cashBridgeNegativeTests!==8 || r.cashBridgeUnknownCodeChecks!==1 || r.physicalChecks!==44 || r.physicalNegativeTests!==8 || !a.every(x=>x.physicalCheckpoints===11 && x.physicalNegativeTests===2 && x.physicalStages.length===11 && x.physicalStages.every(y=>y.totalMilli===x.producedMilli && Object.values(y.components).reduce((n,v)=>n+v,0)===x.producedMilli)) || r.prereleaseGate!=='BLOCKED') process.exit(1);"
      - name: Pruefbeleg sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-oil-export
          path: natural_oil_export.json
          if-no-files-found: warn
          retention-days: 14
