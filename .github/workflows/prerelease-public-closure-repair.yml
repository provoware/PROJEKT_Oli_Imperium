name: Projekt C – oeffentliche Frachtsperre und Reparatur ueber 11 Monate
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_public_closure_repair_v194.cjs'
      - 'project-c/pppoppi-imperium/quality_v194/PUBLIC_CLOSURE_REPAIR_20261031.md'
      - 'project-c/pppoppi-imperium/SPIEL/src/**'
      - 'project-c/pppoppi-imperium/prerelease/matrix.json'
      - '.github/workflows/prerelease-public-closure-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zwei Firmen mit M8-Sperre, M9-Reparatur und unabhaengiger Bilanz
        run: |
          set -o pipefail
          node --check project-c/pppoppi-imperium/quality_v194/test_public_closure_repair_v194.cjs
          node project-c/pppoppi-imperium/quality_v194/test_public_closure_repair_v194.cjs | tee public_closure_repair.json
          node -e "const r=require('./public_closure_repair.json'),x=r.result; if(r.schema!=='pppoppi.multifirm-public-closure-repair/1'||r.runs!==2||r.simulatedMonths!==22||r.companyMonthChecks!==44||r.jsonRoundtrips!==42||r.duplicatesRejected!==12||r.corruptionsCaught!==20||r.foreignActionsRejected!==2||r.publicRepairs!==2||r.noInjectedInventoryOrCash!==true||r.prereleaseGate!=='BLOCKED'||!x||x.months!==11||x.finalMonth!==11||x.closedMonth!==8||x.repairedMonth!==9||x.sold?.H1!==18000||x.sold?.H2!==18000)process.exit(1);"
      - name: Reproduzierbaren JSON-Nachweis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-closure-repair-11months
          path: public_closure_repair.json
          if-no-files-found: warn
          retention-days: 14
