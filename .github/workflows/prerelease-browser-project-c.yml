name: Projekt C – echter Offline-Browser-Rundlauf
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/**'
      - '.github/workflows/prerelease-browser-project-c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Natuerliche 240-Monats-Partie mit zwei Menschen und Spielende-Diagnose (kein Release-PASS)
        run: node project-c/pppoppi-imperium/quality_v194/test_endstate_audit_v194.cjs
      - name: Monatsobergrenze, Duplikatschutz und sichere Ablehnung (kein Release-PASS)
        run: node project-c/pppoppi-imperium/quality_v194/test_endstate_boundaries_v194.cjs
      - name: Chromium-Testumgebung installieren
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Offline-Dateistart, Tastatur, 800x600, Speichern, Neustart, defekter Import
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_roundtrip_v194.py
      - name: Alle Spielszenen, Tastatur und zoom-aequivalente CSS-Viewports
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_scenes_v194.py
      - name: Alle Spielszenen per Tab und Enter schliessen, Alt-Links und Fokus pruefen
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_keyboard_scenes_v194.py
      - name: Zwoelf Browser-Spielmonate mit drei Neustart- und Importzyklen
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_longrun_v194.py
      - name: Wirtschaft, Vertrag, Abrechnung und Spielstand-Neustart mit echten Browserklicks
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_economy_v194.py
      - name: Sanierung mit Kredit, Notverkauf und Neustart im echten Browser
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_rescue_v194.py
      - name: Natuerliche Insolvenz durch acht Wirtschaftsklicks mit Kredit, Notverkauf und Neustart
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_natural_rescue_v194.py
      - name: Zwei Menschen, Spielerwechsel, parallele Insolvenz und getrennte Sanierung
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_two_humans_v194.py
      - name: Wiederholte Spielstand-Imports, kaputte Dateien und Schutz vor Doppelbuchungen
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_reimport_v194.py
      - name: Import-Wettlauf, Spielaktion waehrend Import und Sitzungsabbruch
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_import_race_v194.py
      - name: V0.8-Altspielstand migrieren, V0.8.2 erhalten, V0.6 sicher ablehnen
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_legacy_v194.py
      - name: Altvertrag, laufendes Minispiel und abgeschlossenes Minispiel sicher migrieren
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_legacy_special_v194.py
      - name: Erfuellte und gebrochene V0.8-Vertraege samt Buchungen migrieren
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_legacy_contracts_v194.py
      - name: Unvollstaendige Exportkopien, Abbruch und Rueckfall auf gueltige Sicherung
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_save_interruption_v194.py
      - name: Zwei lokale Zwischensicherungen, Browser-Neustart und sicherer Rueckfall
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_autobackup_v194.py
      - name: Schreibtransaktionsabbruch, Speicherverweigerung und Wiederherstellung
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_storage_faults_v194.py
      - name: Drei unabhaengige Offline-Leistungsprofile mit je zwoelf Monatswechseln
        run: |
          for run in 1 2 3; do
            echo "::group::Leistungsprofil $run von 3"
            python3 project-c/pppoppi-imperium/quality_v194/test_browser_performance_v194.py
            echo "::endgroup::"
          done
      - name: Laengere 48-Monats-Partie mit fuenf bereinigten Speichermessungen
        env:
          PPPOPPI_PERF_MONTHS: '48'
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_performance_v194.py
