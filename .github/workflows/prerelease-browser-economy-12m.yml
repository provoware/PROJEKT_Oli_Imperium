name: Projekt C – zwölf Wirtschaftsmonate mit Browserneustarts
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_browser_economy_12months_restart_v194.py'
      - '.github/workflows/prerelease-browser-economy-12m.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economy-browser-12m:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax prüfen
        run: |
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_economy_12months_restart_v194.py
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_campaign_lastmonth_rescue_v194.py
      - name: Chromium installieren
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Zwölf Monate, echte Wirtschaftsklicks und Browserneustarts
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_economy_12months_restart_v194.py
