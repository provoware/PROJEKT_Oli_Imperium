name: Projekt C – drei gemischte Schlussmonatsrettungen
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/**'
      - '.github/workflows/prerelease-triple-lastmonth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-triple-lastmonth-rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax und Testimporte pruefen
        run: |
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_campaign_triple_lastmonth_v194.py
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_campaign_lastmonth_rescue_v194.py
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_natural_rescue_v194.py
      - name: Chromium installieren
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Drei Insolvenzen, drei Rettungswege, vier Browserprozesse
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_campaign_triple_lastmonth_v194.py
