name: OLI Vorrelease - Bohrspiel-Neustarts bei echtem Zoom
on:
  pull_request:
    paths:
      - 'project-c/pppoppi-imperium/quality_v194/test_browser_campaign_drill_recovery_v194.py'
      - '.github/workflows/prerelease-campaign-drill-zoom-recovery.yml'
      - 'project-c/pppoppi-imperium/quality_v194/DRILL_ZOOM_RESTART_20261103.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill-midstage-native-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        zoom: [175, 200]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax vor Chromium-Installation
        run: |
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_campaign_drill_recovery_v194.py
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_native_zoom_v194.py
          python3 -m py_compile project-c/pppoppi-imperium/quality_v194/test_browser_keyboard_drill_v194.py
      - name: Chromium und Playwright installieren
        run: bash project-c/pppoppi-imperium/quality_v194/install_chromium_ci.sh
      - name: 12 Monate, Bohrabschnitt 0 und 1, vier Chromium-Prozesse, echter Tab-Zoom
        run: python3 project-c/pppoppi-imperium/quality_v194/test_browser_campaign_drill_recovery_v194.py --zoom ${{ matrix.zoom }}
